name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege; the deploy job asks for package writes itself.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Postgres, as in production: row locks (select_for_update) are skipped on
    # SQLite, so the order and stock rules are only exercised here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-0123456789abcdefghij
      DEBUG: "1"
      DATABASE_URL: postgres://postgres:ci-password@localhost:5432/pos
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Production settings load
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "0"
          ALLOWED_HOSTS: api.example.com
          REDIS_URL: redis://localhost:6379/0

      - name: Django tests
        run: python manage.py test --verbosity=1

      - name: Caddyfile is valid
        run: >
          docker run --rm -v "$PWD/caddy:/etc/caddy:ro"
          -e DOMAIN=pos.example.com -e ACME_EMAIL=ci@example.com
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  print-agent:
    name: Print agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: print-agent
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Tests (with a stand-in LAN printer)
        run: bun test

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint && bun run format:check

      - name: Types
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: End-to-end (tablet viewports, mock API)
        run: bunx playwright install --with-deps chromium && bun run e2e

  deploy:
    name: Build images and deploy
    needs: [backend, print-agent, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One deploy at a time; a newer push waits instead of cancelling a deploy half way.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compute image names
        id: img
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "api=${REGISTRY}/${OWNER}/pos-api" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/${OWNER}/pos-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.img.outputs.api }}:${{ github.sha }}
            ${{ steps.img.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web image (Caddy + the React app)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.img.outputs.web }}:${{ github.sha }}
            ${{ steps.img.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Everything below runs only once the server exists: set the repository
      # variable DEPLOY_ENABLED=true and the DEPLOY_* secrets (docs/deployment.md).
      - name: Setup SSH key
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -z "$SSH_KEY_B64" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Set the DEPLOY_SSH_KEY_B64 and DEPLOY_KNOWN_HOSTS repository secrets (docs/deployment.md)."
            exit 1
          fi
          if ! printf '%s' "$SSH_KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null; then
            echo "::error::DEPLOY_SSH_KEY_B64 is not valid base64. Copy it with: base64 < ~/.ssh/pos_deploy | tr -d '\n' | pbcopy"
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::The deploy key could not be read. Expected a private key with no passphrase, not the .pub file."
            exit 1
          fi
          # The server's host key is pinned (ssh-keyscan -H <host>, run once from
          # a trusted machine), so a spoofed host is refused.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to the VPS
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          APP_IMAGE: ${{ steps.img.outputs.api }}:${{ github.sha }}
          WEB_IMAGE: ${{ steps.img.outputs.web }}:${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes"
          GHCR_USER_LC="$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')"
          ssh $SSH_OPTS -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "PROJECT_PATH='${{ secrets.DEPLOY_PATH }}' APP_IMAGE='$APP_IMAGE' WEB_IMAGE='$WEB_IMAGE' REGISTRY='$REGISTRY' GHCR_USER='$GHCR_USER_LC' GHCR_TOKEN='$GHCR_TOKEN' bash -s" << 'EOF'
          set -euo pipefail
          cd "$PROJECT_PATH/backend"
          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          else
            DOCKER=(sudo docker)
          fi
          compose() { "${DOCKER[@]}" compose --env-file .env -f docker-compose.prod.yml "$@"; }
          # Caddy must own ports 80/443 to serve the POS and renew its certificate.
          if systemctl is-active --quiet nginx 2>/dev/null; then
            echo "Host nginx is running and conflicts with Caddy on ports 80/443." >&2
            echo "Run once on the server: sudo systemctl disable --now nginx" >&2
            exit 1
          fi
          # The registry login is only needed for the pull; never leave it behind.
          trap '"${DOCKER[@]}" logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          echo "$GHCR_TOKEN" | "${DOCKER[@]}" login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          # The compose file, Caddyfile and scripts come from the repository.
          git pull --ff-only origin main
          export APP_IMAGE WEB_IMAGE
          # A failed pull must stop the deploy, not quietly restart the old images.
          compose pull api caddy
          compose up -d --no-build --remove-orphans
          # Load an edited Caddyfile even when the container was not recreated. A
          # bad config is rejected and the running one stays.
          compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

          # Wait for the API container's own health check (GET /health/).
          for attempt in $(seq 1 30); do
            status="$("${DOCKER[@]}" inspect --format '{{.State.Health.Status}}' pos-api 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then
              echo "API is healthy."
              "${DOCKER[@]}" image prune -f >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy (last status: $status). Recent logs:" >&2
          compose logs --tail 100 api >&2
          exit 1
          EOF
